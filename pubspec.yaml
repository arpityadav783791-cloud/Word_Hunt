
name: word_hunt
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  english_words: ^4.0.0
  url_launcher: ^6.3.3
  http: ^1.6.0
  sqflite: ^2.4.5
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.5
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/phonepe_qr.png
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/word_hunt_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true